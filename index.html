<style>
[hidden]{display:none!important}
/* Layout: sticky header with search; figure view = zoomable scan beside its parts list (stacked, drawing pinned, on phones). */
:root {
  --bg: #eceff2;
  --surface: #ffffff;
  --paper: #ffffff;
  --ink: #18212c;
  --muted: #5a6675;
  --line: #d3d9e0;
  --accent: #1d4f91;
  --accent-ink: #ffffff;
  --hot: #c2410c;
  --hot-fill: rgba(245, 180, 0, 0.42);
  --hover-fill: rgba(29, 79, 145, 0.16);
  --sel-bg: #fbefc4;
  --hov-bg: #e4ecf7;
  --shadow: 0 1px 2px rgba(20, 30, 45, .08), 0 4px 14px rgba(20, 30, 45, .06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --hdr: 56px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151b; --surface: #1a2028; --paper: #e8e8e3; --ink: #e5e9ee; --muted: #9ba7b5; --line: #2c3541;
  --accent: #86b4ff; --accent-ink: #0d1726; --hot: #ff7a3d; --hot-fill: rgba(245, 180, 0, 0.5); --hover-fill: rgba(60, 120, 220, 0.22);
  --sel-bg: #3b3218; --hov-bg: #1f2c3f; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #1a2028; --paper: #e8e8e3; --ink: #e5e9ee; --muted: #9ba7b5; --line: #2c3541;
  --accent: #86b4ff; --accent-ink: #0d1726; --hot: #ff7a3d; --hot-fill: rgba(245, 180, 0, 0.5); --hover-fill: rgba(60, 120, 220, 0.22);
  --sel-bg: #3b3218; --hov-bg: #1f2c3f; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--hdr); display: flex; align-items: center; gap: 16px;
  padding-inline: 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand span { color: var(--accent); }
.search { flex: 1; max-width: 520px; margin-left: auto; position: relative; }
.search input {
  width: 100%; height: 38px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  padding: 0 12px 0 34px; font: inherit;
}
.search svg { position: absolute; left: 10px; top: 11px; width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 2; }

main { padding-inline: 16px; padding-block: 20px 40px; max-width: 1500px; margin: 0 auto; }
.eyebrow { font-family: var(--f-display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-size: 14px; }
h1, h2 { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.05; }
h1 { font-size: clamp(28px, 4.5vw, 44px); }
h2 { font-size: 22px; }
.lede { color: var(--muted); max-width: 62ch; margin: 8px 0 0; }

/* home */
.home { display: grid; gap: 28px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.card { min-width: 0; display: grid; grid-template-rows: auto 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; text-decoration: none; color: var(--ink); box-shadow: var(--shadow); transition: transform .15s; }
.card:hover { transform: translateY(-2px); }
.card .thumb { height: 240px; background: var(--paper); padding: 8px; overflow: hidden; }
.card .thumb img { display: block; width: 100%; height: 100%; max-width: 100%; object-fit: contain; }
.card .cap { min-width: 0; align-content: start; padding: 10px 12px 12px; display: grid; gap: 2px; border-top: 1px solid var(--line); }
.card .fig { font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }
.card .t { font-weight: 600; line-height: 1.25; }
.card .n { color: var(--muted); font-size: 13px; }
.figlist { columns: 3 280px; column-gap: 28px; margin: 0; padding: 0; list-style: none; }
.figlist li { break-inside: avoid; display: grid; grid-template-columns: 3.4em 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.figlist .no { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.figlist a { text-decoration: none; color: var(--ink); }
.figlist a:hover { color: var(--accent); text-decoration: underline; }
.figlist .has { font-family: var(--f-display); font-size: 12px; color: var(--hot); letter-spacing: .06em; text-transform: uppercase; margin-left: 6px; }

/* figure view */
.fighead { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 20px; margin-bottom: 12px; }
.fighead .grow { flex: 1; min-width: 0; }
.nav { display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; color: var(--ink); font-size: 14px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; height: calc(100dvh - var(--hdr) - 150px); min-height: 480px; }
.viewer { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.viewer.dragging { cursor: grabbing; }
.viewer.onspot { cursor: pointer; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.stage.anim { transition: transform .35s ease; }
.stage img { display: block; max-width: none; pointer-events: none; }
.stage svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.spot { fill: transparent; stroke: transparent; stroke-width: 5; }
.spot.hov { fill: var(--hover-fill); stroke: var(--accent); }
.spot.sel { fill: var(--hot-fill); stroke: var(--hot); stroke-width: 6; }
.spot.sel.pulse { animation: pulse 1s ease-out 2; }
@keyframes pulse { 0% { stroke-width: 6; } 50% { stroke-width: 16; } 100% { stroke-width: 6; } }
@media (prefers-reduced-motion: reduce) { .spot.sel.pulse { animation: none; } .stage.anim { transition: none; } .card { transition: none; } }
.zoombar { position: absolute; right: 10px; bottom: 10px; display: grid; gap: 6px; z-index: 2; }
.zoombar button { width: 38px; height: 38px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 20px; line-height: 1; box-shadow: var(--shadow); }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; padding: 5px 8px; border-radius: 5px; max-width: 280px; line-height: 1.3; }
.tip b { font-family: var(--f-mono); font-weight: 500; }

.parts { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
thead th { position: sticky; top: 0; z-index: 1; background: var(--surface); text-align: left; font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; color: var(--muted); padding: 8px 8px; border-bottom: 2px solid var(--line); }
td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.ref { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; width: 3.2em; }
td.pn { font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }
td.q { text-align: center; font-variant-numeric: tabular-nums; width: 2.8em; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--hov-bg); }
tr.row.hov td { background: var(--hov-bg); }
tr.row.sel td { background: var(--sel-bg); }
tr.row.sel td.ref { color: var(--hot); font-weight: 500; }
tr.note td { color: var(--muted); font-style: italic; cursor: default; }
.nm { display: block; }
.flag { display: block; font-size: 12px; color: var(--muted); font-style: italic; }
.kit { color: var(--hot); font-weight: 600; }
.nodraw { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 16px; color: var(--muted); margin-bottom: 16px; }

/* search */
.results { display: grid; gap: 8px; }
.res { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) auto; gap: 4px 14px; align-items: baseline; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--ink); }
.res:hover { border-color: var(--accent); }
.res .pn { font-family: var(--f-mono); font-size: 13px; }
.res .where { font-family: var(--f-display); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.res .sub { grid-column: 2 / -1; color: var(--muted); font-size: 13px; }
.res mark { background: var(--sel-bg); color: inherit; }
.muted { color: var(--muted); }
footer { color: var(--muted); font-size: 13px; padding-inline: 16px; padding-block: 0 28px; max-width: 1500px; margin: 0 auto; }

@media (max-width: 860px) {
  .brand small { display: none; }
  .split { display: block; height: auto; min-height: 0; }
  .viewer { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr) + 6px); height: 50dvh; z-index: 5; margin-bottom: 12px; box-shadow: var(--shadow); }
  .parts { overflow: visible; }
  thead th { top: calc(var(--hdr) + 50dvh + 6px); }
  td.pn { white-space: normal; word-break: break-all; }
  .res { grid-template-columns: minmax(0, 1fr) auto; }
  .res .pn { grid-column: 1 / -1; }
  .res .sub { grid-column: 1 / -1; }
}
@media (max-width: 860px) { .fighead h1 { font-size: 26px; } .hint { display: none; } .fighead { margin-bottom: 10px; } }
@media (max-width: 480px) { .brand { font-size: 18px; } .brand span.long { display: none; } }
</style>

</head>

,"1","1","part","",""],[5117,"102","3","0300006-14",2,5114,"Cover Assembly - Left windshield","1","1","part","",""],[5118,"102","4","0500006-10",2,5114,"Plate Assembly - Windshield attachment","4","4","part","",""],[5119,"102","","0300006-7",2,5114,"Cover Assembly - Left","1","1","part","",""],[5120,"102","5","0300006-4",3,5119,"Bracket - Side window","1","1","part","",""],[5121,"102","6","0300006-6",3,5119,"Bracket - Side window","1","1","part","",""],[5122,"102","7","0300006-9",3,5119,"Cover - Side window","1","1","part","",""],[5123,"102","8","PK76XZ-6-4",3,5119,"Screw - (Attach bracket)","4","4","part","",""],[5124,"102","9","NAS446-3",3,5119,"Nut - (Attach bracket)","4","4","part","",""],[5125,"102","","0300006-8",2,5114,"Cover Assembly - Right","1","1","part","",""],[5126,"102","10","0300006-3",3,5125,"Bracket - Side window","1","1","part","",""],[5127,"102","11","0300006-5",3,5125,"Bracket - Side window","1","1","part","",""],[5128,"102","12","0300006-9",3,5125,"Cover - Side window","1","1","part","",""],[5129,"102","13","PK76XZ-6-4",3,5125,"Screw - (Attach bracket)","4","4","part","",""],[5130,"102","14","NAS446-3",3,5125,"Nut - (Attach bracket)","4","4","part","",""],[5131,"102","15","0511061",2,5114,"Goggles - Blind flying","1","1","part","",""],[5132,"103","1","100004-79",1,0,"Jack Point - Universal","1","1","part","",""],[5133,"104","","52-3-595",1,0,"Installation Kit - Sun visor (Cessna 0511058)","1","1","part","",""],[5134,"104","1","0511058-4",2,5133,"Visor - Sun","1","1","part","",""],[5135,"104","2","AN3-5A",2,5133,"Bolt - (Attach sun visor)","1","1","part","",""],[5136,"104","3","AN960-10L",2,5133,"Washer - (Attach sun visor)","1","1","part","",""],[5137,"105","","0511024",1,0,"Installation Kit - Navigation light flasher","1","1","part","ref printed as '105-' with no item number; ref_no left empty",""],[5138,"105","","0511025-2",2,5137,"Flasher Assembly - Navigation light","1","1","part","",""],[5139,"105","1","0511025",3,5138,"Flasher - Navigation light (Narco FL-1)","1","1","part","",""],[5140,"105","2","0511025-1",4,5139,"Filter - Navigation light","1","1","part","",""],[5141,"105","3","0511025-3",3,5138,"Plate - Flasher","1","1","part","",""],[5142,"105","4","AN340-B-8",3,5138,"Nut - (Attach filter)","1","1","part","",""],[5143,"105","5","AN936A8",3,5138,"Washer - (Attach filter)","1","1","part","",""],[5144,"105","6","BB-2",3,5138,"Connector - (Sta-Kon)","1","1","part","",""],[5145,"105","7","RA863",3,5138,"Terminal - (Sta Kon)","1","1","part","",""],[5146,"105","8","PK76XZ-8-8",3,5138,"Screw - (Attach flasher)","2","2","part","",""],[5147,"105","9","NAS446-4",3,5138,"Nut - (Tinnerman A1778-8Z3)","2","2","part","",""]]};</script>
<script>
(function () {
  const $main = document.getElementById('main');
  const $q = document.getElementById('q');
  let D, figs = [], figById = {}, rowsByFig = {}, rowById = {};

  const imgSrc = n => (window.C195_IMG && window.C195_IMG[n]) || `img/${n}.webp`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const title = s => (s || '').toLowerCase().replace(/(^|[\s\-(/&])([a-z])/g, (m, a, b) => a + b.toUpperCase()).replace(/\bEff\b\.?/g, 'Eff.');

  (window.C195_DATA ? Promise.resolve(window.C195_DATA) : fetch('data/catalog.json').then(r => r.json())).then(init).catch(() => {
    $main.innerHTML = '<p>The catalog data could not be loaded. Reload the page to try again.</p>';
  });

  function init(data) {
    D = data;
    const C = D.cols;
    for (const a of D.parts) {
      const r = {}; C.forEach((k, i) => r[k] = a[i]);
      rowById[r.id] = r;
      (rowsByFig[r.fig] = rowsByFig[r.fig] || []).push(r);
    }
    figs = D.figures;
    figs.forEach((f, i) => { f.i = i; figById[f.id] = f; });
    window.addEventListener('hashchange', route);
    $q.addEventListener('input', () => { $q.value.trim() ? renderSearch($q.value.trim()) : route(); });
    route();
  }

  function route() {
    if ($q.value.trim()) { $q.value = ''; }
    const h = location.hash.replace(/^#/, '');
    const m = h.match(/^fig-([0-9]+[A-Z]?)(?:-(\d+))?$/i);
    if (m && figById[m[1].toUpperCase()]) renderFigure(m[1].toUpperCase(), m[2] || null);
    else renderHome();
  }

  // ---------- home ----------
  function renderHome() {
    document.title = 'C195 Parts Catalog';
    const drawn = figs.filter(f => D.drawings[f.id]);
    $main.innerHTML = `
      <section class="home">
        <div>
          <div class="eyebrow">Illustrated Parts Catalog · Models 190 &amp; 195 · Nov 1954</div>
          <h1>Find a part on the drawing</h1>
          <p class="lede">Open a figure and tap any circled callout to see the part number, name and quantity for the 190 and the 195. Tap a row in the list to find the part on the drawing. The search box looks across all ${figs.length} figures and ${D.parts.length.toLocaleString()} catalog lines.</p>
        </div>
        <div>
          <h2>Clickable drawings</h2>
          <div class="cards" style="margin-top:12px">${drawn.map(f => `
            <a class="card" href="#fig-${f.id}">
              <div class="thumb"><img src="${imgSrc('thumb' + f.id)}" alt="Figure ${f.id} drawing" loading="lazy"></div>
              <div class="cap"><span class="fig">Figure ${f.id}</span><span class="t">${esc(title(f.title))}</span><span class="n">${D.drawings[f.id].spots.length ? D.drawings[f.id].spots.length + ' callouts' : 'Wiring diagram'} · catalog p. ${esc(f.catalog_page)}</span></div>
            </a>`).join('')}
          </div>
        </div>
        <div>
          <h2>All figures</h2>
          <p class="lede" style="margin-bottom:12px">Every figure's parts list is here. Figures without a drawing yet show the list only.</p>
          <ul class="figlist">${figs.map(f => `
            <li><span class="no">${esc(f.id)}</span><span><a href="#fig-${f.id}">${esc(title(f.title))}</a>${D.drawings[f.id] ? '<span class="has">Drawing</span>' : ''}</span></li>`).join('')}
          </ul>
        </div>
      </section>`;
    window.scrollTo(0, 0);
  }

  // ---------- figure ----------
  let viewer = null;
  function refOf(r) {
    let cur = r, guard = 0;
    while (cur && !cur.ref && cur.parent && guard++ < 10) { const p = rowById[cur.parent]; if (!p || p.fig !== r.fig) break; cur = p; }
    return cur && cur.ref ? cur.ref : null;
  }
  function pnCell(pn) {
    const m = pn.match(/^See figure\s+([0-9]+[A-Z]?)/i);
    return m && figById[m[1].toUpperCase()] ? `<a href="#fig-${m[1].toUpperCase()}" onclick="event.stopPropagation()">${esc(pn)}</a>` : esc(pn);
  }

  function renderFigure(id, ref) {
    const f = figById[id], dr = D.drawings[id], rows = rowsByFig[id] || [];
    document.title = `Figure ${id}, ${title(f.title)} · C195 Parts Catalog`;
    const prev = figs[f.i - 1], next = figs[f.i + 1];
    $main.innerHTML = `
      <div class="fighead">
        <div class="grow">
          <div class="eyebrow">Figure ${esc(id)} · catalog page ${esc(f.catalog_page)}</div>
          <h1>${esc(title(f.title))}</h1>
        </div>
        <div class="nav">
          ${prev ? `<a class="btn" href="#fig-${prev.id}" title="${esc(title(prev.title))}">← Fig ${esc(prev.id)}</a>` : ''}
          ${next ? `<a class="btn" href="#fig-${next.id}" title="${esc(title(next.title))}">Fig ${esc(next.id)} →</a>` : ''}
        </div>
      </div>
      ${dr ? '<p class="hint">Tap a callout to find the part in the list, or tap a row to find it on the drawing. Drag to pan; pinch, scroll or double-tap to zoom.</p>'
           : `<div class="nodraw">The clickable drawing for this figure isn't available yet. It is on catalog page ${esc(f.catalog_page)} of the printed book.</div>`}
      <div class="${dr ? 'split' : ''}">
        ${dr ? `<div class="viewer" id="viewer"></div>` : ''}
        <div class="parts" id="parts">
          <table>
            <thead><tr><th>Ref</th><th>Part number</th><th>Description</th><th class="q">190</th><th class="q">195</th></tr></thead>
            <tbody>${rows.map(r => r.type === 'note'
              ? `<tr class="note"><td></td><td colspan="4">${esc(r.name)}</td></tr>`
              : `<tr class="row" tabindex="0" data-id="${r.id}" data-ref="${esc(refOf(r) || '')}" data-own="${esc(r.ref)}">
                  <td class="ref">${r.ref ? esc(id + '-' + r.ref) : ''}</td>
                  <td class="pn">${pnCell(r.pn)}</td>
                  <td style="padding-left:${8 + (r.ind - 1) * 14}px"><span class="nm">${r.kit ? '<span class="kit" title="Part of a kit">* </span>' : ''}${esc(r.name)}</span>${r.flag ? `<span class="flag">Note: ${esc(r.flag)}</span>` : ''}</td>
                  <td class="q">${esc(r.q190)}</td><td class="q">${esc(r.q195)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    window.scrollTo(0, 0);
    const tbody = $main.querySelector('tbody');
    const rowEls = [...tbody.querySelectorAll('tr.row')];
    const byRef = {};
    rowEls.forEach(tr => { const k = tr.dataset.own; if (k) (byRef[k] = byRef[k] || []).push(tr); });

    function markRows(refv, cls, scroll) {
      rowEls.forEach(tr => tr.classList.remove(cls));
      if (!refv) return;
      const list = byRef[refv] || [];
      list.forEach(tr => tr.classList.add(cls));
      if (scroll && list[0]) {
        const box = document.getElementById('parts');
        if (window.matchMedia('(max-width: 860px)').matches) {
          const top = list[0].getBoundingClientRect().top + window.scrollY - (document.getElementById('viewer').getBoundingClientRect().bottom) - 60;
          window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        } else {
          box.scrollTo({ top: list[0].offsetTop - box.clientHeight / 3, behavior: 'smooth' });
        }
      }
    }
    function select(refv, from) {
      markRows(refv, 'sel', from === 'drawing');
      if (viewer) viewer.select(refv, from === 'table');
      const h = refv ? `#fig-${id}-${refv}` : `#fig-${id}`;
      if (location.hash !== h) history.replaceState(null, '', h);
    }

    if (dr) {
      const names = {};
      rows.forEach(r => { if (r.ref && r.type !== 'note' && !names[r.ref]) names[r.ref] = r; });
      viewer = makeViewer(document.getElementById('viewer'), id, dr, {
        pick: refv => select(refv, 'drawing'),
        hover: refv => markRows(refv, 'hov', false),
        label: refv => { const r = names[refv]; return r ? `<b>${esc(id)}-${esc(refv)}</b> ${esc(r.name)}<br><b>${esc(r.pn)}</b>` : `<b>${esc(id)}-${esc(refv)}</b>`; }
      });
    } else viewer = null;

    tbody.addEventListener('click', e => {
      const tr = e.target.closest('tr.row'); if (!tr) return;
      if (tr.dataset.ref) select(tr.dataset.ref, 'table');
    });
    tbody.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const tr = e.target.closest('tr.row'); if (!tr) return;
      e.preventDefault(); if (tr.dataset.ref) select(tr.dataset.ref, 'table');
    });
    if (viewer) viewer.whenReady(() => { if (ref) select(ref, 'table'); });
    else if (ref) markRows(ref, 'sel', true);
  }

  // ---------- pan/zoom viewer ----------
  function makeViewer(el, id, dr, cb) {
    const W = dr.w, H = dr.h;
    el.innerHTML = `
      <div class="stage"><img alt="Figure ${esc(id)} drawing" width="${W}" height="${H}" src="${imgSrc('fig' + id)}">
        <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${dr.spots.map((s, i) =>
          `<circle class="spot" data-i="${i}" cx="${s[1]}" cy="${s[2]}" r="${s[3] + 7}"></circle>`).join('')}</svg></div>
      <div class="zoombar"><button type="button" data-z="in" aria-label="Zoom in">+</button><button type="button" data-z="out" aria-label="Zoom out">−</button><button type="button" data-z="fit" aria-label="Fit drawing" style="font-size:14px">⤢</button></div>
      <div class="tip" hidden></div>`;
    const stage = el.querySelector('.stage'), img = stage.querySelector('img'), tip = el.querySelector('.tip');
    const circles = [...stage.querySelectorAll('circle')];
    let s = 1, tx = 0, ty = 0, fit = 1, ready = false, readyCbs = [], hovRef = null;

    function apply(anim) {
      stage.classList.toggle('anim', !!anim);
      stage.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
    }
    function clamp() {
      const cw = el.clientWidth, ch = el.clientHeight, iw = W * s, ih = H * s;
      const m = 80;
      tx = iw < cw ? (cw - iw) / 2 : Math.min(m, Math.max(cw - iw - m, tx));
      ty = ih < ch ? (ch - ih) / 2 : Math.min(m, Math.max(ch - ih - m, ty));
    }
    function doFit(anim) {
      fit = Math.min(el.clientWidth / W, el.clientHeight / H);
      s = fit; tx = (el.clientWidth - W * s) / 2; ty = (el.clientHeight - H * s) / 2; apply(anim);
    }
    function zoomAt(px, py, ns, anim) {
      ns = Math.max(fit * 0.9, Math.min(2.5, ns));
      tx = px - (px - tx) * (ns / s); ty = py - (py - ty) * (ns / s); s = ns; clamp(); apply(anim);
    }
    function toImg(cx, cy) { const b = el.getBoundingClientRect(); return [(cx - b.left - tx) / s, (cy - b.top - ty) / s]; }
    function hit(cx, cy, touch) {
      const [x, y] = toImg(cx, cy); let best = null, bd = Infinity;
      dr.spots.forEach((sp, i) => {
        const d = Math.hypot(sp[1] - x, sp[2] - y), lim = sp[3] + (touch ? 22 : 8) / s * Math.min(1, s * 2);
        if (d < Math.max(lim, sp[3] + 6) && d < bd) { bd = d; best = i; }
      });
      return best;
    }
    function setHover(i, cx, cy) {
      const refv = i == null ? null : dr.spots[i][0];
      circles.forEach((c, k) => c.classList.toggle('hov', refv != null && dr.spots[k][0] === refv));
      el.classList.toggle('onspot', refv != null);
      if (refv !== hovRef) { hovRef = refv; cb.hover(refv); }
      if (refv == null) { tip.hidden = true; return; }
      const b = el.getBoundingClientRect();
      tip.innerHTML = cb.label(refv); tip.hidden = false;
      let x = cx - b.left + 14, y = cy - b.top + 14;
      if (x + tip.offsetWidth > b.width - 8) x = cx - b.left - tip.offsetWidth - 14;
      if (y + tip.offsetHeight > b.height - 8) y = cy - b.top - tip.offsetHeight - 14;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }

    // pointer handling: drag, pinch, tap
    const pts = new Map(); let start = null, moved = false, pinch = null, lastTap = 0;
    el.addEventListener('pointerdown', e => {
      if (e.target.closest('.zoombar')) return;
      el.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) { start = { x: e.clientX, y: e.clientY, tx, ty }; moved = false; }
      if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, tx, ty }; moved = true;
      }
    });
    el.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) { if (e.pointerType === 'mouse') setHover(hit(e.clientX, e.clientY, false), e.clientX, e.clientY); return; }
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const b = el.getBoundingClientRect();
      if (pts.size >= 2 && pinch) {
        const [p, q] = [...pts.values()];
        const d = Math.hypot(p.x - q.x, p.y - q.y), mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
        const ns = Math.max(fit * 0.9, Math.min(2.5, pinch.s * d / pinch.d));
        const px = pinch.mx - b.left, py = pinch.my - b.top;
        tx = px - (px - pinch.tx) * (ns / pinch.s) + (mx - pinch.mx); ty = py - (py - pinch.ty) * (ns / pinch.s) + (my - pinch.my); s = ns;
        clamp(); apply(false); return;
      }
      if (start) {
        const dx = e.clientX - start.x, dy = e.clientY - start.y;
        if (!moved && Math.hypot(dx, dy) > 6) { moved = true; el.classList.add('dragging'); tip.hidden = true; }
        if (moved) { tx = start.tx + dx; ty = start.ty + dy; clamp(); apply(false); }
      }
    });
    function end(e) {
      if (!pts.has(e.pointerId)) return;
      pts.delete(e.pointerId);
      if (pts.size < 2) pinch = null;
      if (pts.size === 0) {
        el.classList.remove('dragging');
        if (!moved && e.type === 'pointerup') {
          const now = Date.now(), b = el.getBoundingClientRect();
          const i = hit(e.clientX, e.clientY, e.pointerType !== 'mouse');
          if (i != null) { cb.pick(dr.spots[i][0]); if (e.pointerType !== 'mouse') setHover(null); }
          else if (now - lastTap < 320) zoomAt(e.clientX - b.left, e.clientY - b.top, s * 2, true);
          lastTap = i == null ? now : 0;
        }
        start = null;
      } else if (pts.size === 1) { const [p] = [...pts.values()]; start = { x: p.x, y: p.y, tx, ty }; }
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !pts.size) setHover(null); });
    el.addEventListener('wheel', e => {
      e.preventDefault(); const b = el.getBoundingClientRect();
      zoomAt(e.clientX - b.left, e.clientY - b.top, s * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0018)), false);
    }, { passive: false });
    el.querySelector('.zoombar').addEventListener('click', e => {
      const z = e.target.closest('button')?.dataset.z; if (!z) return;
      if (z === 'fit') return doFit(true);
      zoomAt(el.clientWidth / 2, el.clientHeight / 2, s * (z === 'in' ? 1.6 : 1 / 1.6), true);
    });
    new ResizeObserver(() => { if (ready) { const oldFit = fit; fit = Math.min(el.clientWidth / W, el.clientHeight / H); if (s === oldFit) doFit(false); else { clamp(); apply(false); } } }).observe(el);

    function onLoad() { doFit(false); ready = true; readyCbs.forEach(f => f()); readyCbs = []; }
    if (img.complete && img.naturalWidth) requestAnimationFrame(onLoad); else img.addEventListener('load', onLoad);

    return {
      whenReady(f) { ready ? f() : readyCbs.push(f); },
      select(refv, center) {
        const idx = []; circles.forEach((c, k) => { const on = refv != null && dr.spots[k][0] === refv; c.classList.toggle('sel', on); c.classList.remove('pulse'); if (on) idx.push(k); });
        if (!idx.length) return;
        void stage.offsetWidth; idx.forEach(k => circles[k].classList.add('pulse'));
        if (!center) return;
        const xs = idx.map(k => dr.spots[k][1]), ys = idx.map(k => dr.spots[k][2]);
        const x0 = Math.min(...xs) - 120, x1 = Math.max(...xs) + 120, y0 = Math.min(...ys) - 120, y1 = Math.max(...ys) + 120;
        const cw = el.clientWidth, ch = el.clientHeight;
        let ns = Math.min(cw / (x1 - x0), ch / (y1 - y0), Math.max(s, fit * 2.2, 0.55));
        ns = Math.max(fit, Math.min(2.5, ns));
        s = ns; tx = cw / 2 - (x0 + x1) / 2 * s; ty = ch / 2 - (y0 + y1) / 2 * s; clamp(); apply(true);
      }
    };
  }

  // ---------- search ----------
  function norm(s) { return s.toLowerCase().replace(/[\s\-.]/g, ''); }
  function renderSearch(q) {
    const nq = norm(q), words = q.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = [];
    for (const r of D.parts) {
      const [rid, fig, ref, pn, , parent, name, q190, q195, type] = r;
      if (type === 'note') continue;
      const pnHit = nq.length >= 2 && norm(pn).includes(nq);
      const nmHit = words.length && words.every(w => name.toLowerCase().includes(w));
      if (pnHit || nmHit) hits.push({ rid, fig, ref, pn, parent, name, q190, q195, score: pnHit ? (norm(pn) === nq ? 0 : 1) : 2 });
      if (hits.length > 600) break;
    }
    hits.sort((a, b) => a.score - b.score);
    const shown = hits.slice(0, 200);
    const hl = s => { let out = esc(s); words.forEach(w => { if (w.length > 1) out = out.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); }); return out; };
    $main.innerHTML = `
      <div class="eyebrow">Search</div>
      <h1 style="margin-bottom:6px">${hits.length ? `${hits.length > 600 ? '600+' : hits.length} catalog line${hits.length === 1 ? '' : 's'} for “${esc(q)}”` : `Nothing found for “${esc(q)}”`}</h1>
      <p class="lede" style="margin-bottom:16px">${hits.length ? 'Each line is one place the part is used. Open it to see the part in its figure.' : 'Try part of the number (for example 0411) or one word of the name (for example pulley).'}</p>
      <div class="results">${shown.map(h => {
        const par = h.parent && rowById[h.parent] ? rowById[h.parent].name : '';
        const target = h.ref ? `#fig-${h.fig}-${h.ref}` : `#fig-${h.fig}`;
        return `<a class="res" href="${target}">
          <span class="pn">${esc(h.pn)}</span>
          <span>${hl(h.name)}</span>
          <span class="where">Fig ${esc(h.fig)}${h.ref ? '-' + esc(h.ref) : ''}${D.drawings[h.fig] ? ' ●' : ''}</span>
          <span class="sub">${esc(title(figById[h.fig]?.title || ''))}${par ? ' · in ' + esc(par) : ''} · qty 190: ${esc(h.q190 || '–')}, 195: ${esc(h.q195 || '–')}</span>
        </a>`; }).join('')}</div>
      ${hits.length > shown.length ? `<p class="muted">Showing the first ${shown.length}. Add more of the number or name to narrow it down.</p>` : ''}`;
    window.scrollTo(0, 0);
  }
})();
</script>

</body>
